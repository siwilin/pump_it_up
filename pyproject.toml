[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-it-up-portfolio"
version = "0.1.0"
description = "Reproducible predictive-maintenance portfolio project for water pumps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "joblib==1.6.0",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "jupyter>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
